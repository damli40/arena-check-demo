# Copy this file to .github/workflows/arena-check.yml in YOUR guard's repo.
# It builds your guard, runs Arena's attack library against it on a local NEAR sandbox inside
# GitHub's runner, and puts the result in the job summary and a downloadable report.
#
# STATUS: this workflow has never run on GitHub. Arena has no public GitHub home yet, so
# damli40/arena@4ff167494e3bc2c04683e7f6dfdf5963079bb5ba below are placeholders: replace ARENA_OWNER with where Arena
# lives and ARENA_COMMIT with a full 40-character commit SHA of Arena (a SHA, not a branch or tag,
# so the code you run cannot change under you).
#
# Also replace the lines marked "<- your ...": your build command and your wasm path.
#
# Why two jobs: the "build" job runs YOUR repo's code (the build), and on a pull request that is
# code written by whoever opened it. Code like that can change anything on the machine it runs on.
# So the build job gets no secrets and hands over only the built files. The "check" job starts on
# a fresh machine, never runs code from the pull request, and is the only job that may see the
# optional MUSE_API_KEY.
#
# What the result is worth: a pull request can also edit this workflow file, and the copy in the
# pull request is the one that runs. So a pass here is your repo's own word, useful to you and
# your reviewers. Someone else can trust a result they ran themselves (./arena check) or one on
# Arena's board.
name: arena check

# pull_request, NEVER pull_request_target: pull_request_target runs with the base repo's secrets
# and a write token, so a stranger's pull request could steal them.
on:
  pull_request:
  push:
    branches: [main]

# Read-only: nothing here writes back to your repo.
permissions:
  contents: read

# Your guard's config and mapping files, if you use them. Set here, once, for both jobs: the check
# job passes a config or mapping to Arena ONLY when you named one here, never just because a file
# with that name turned up in the build job's output (the build runs the pull request's code, and
# that code could write one).
env:
  GUARD_CONFIG: ""    # <- e.g. arena/guard.json, only if your init args differ from Arena's interface
  GUARD_MAPPING: ""   # <- e.g. arena/mapping.json, only if your method names differ

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the guard
        run: |
          echo "prebuilt guard: guard/vault_a.wasm"                          # <- your build command

      # Arena needs the .wasm file, and your config / mapping files if you use them. They are
      # passed to the check job as plain files; nothing in them is run as code.
      - name: Collect the files Arena needs
        env:
          GUARD_WASM: guard/vault_a.wasm   # <- your wasm
        run: |
          rm -rf arena-input && mkdir -p arena-input
          cp -- "$GUARD_WASM" arena-input/guard.wasm
          if [ -n "$GUARD_CONFIG" ]; then cp -- "$GUARD_CONFIG" arena-input/guard.json; fi
          if [ -n "$GUARD_MAPPING" ]; then cp -- "$GUARD_MAPPING" arena-input/mapping.json; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arena-input
          path: arena-input/
          if-no-files-found: error
          retention-days: 1

  check:
    needs: build
    runs-on: ubuntu-latest   # Linux x86_64. Intel macOS and Windows runners cannot run Arena.
    timeout-minutes: 60
    outputs:
      badge: ${{ steps.arena.outputs.badge }}
      beyond: ${{ steps.arena.outputs.beyond-policy }}
      intent: ${{ steps.arena.outputs.against-intent }}
    steps:
      # No checkout here, on purpose: this job never runs code from the pull request.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arena-input
          path: arena-input

      - name: Arena check
        id: arena
        uses: damli40/arena@4ff167494e3bc2c04683e7f6dfdf5963079bb5ba              # <- placeholders, see the top of this file
        with:
          wasm: arena-input/guard.wasm
          # Only when you set GUARD_CONFIG / GUARD_MAPPING at the top of this file.
          config: ${{ env.GUARD_CONFIG != '' && 'arena-input/guard.json' || '' }}
          mapping: ${{ env.GUARD_MAPPING != '' && 'arena-input/mapping.json' || '' }}
          fail-on: beyond-policy            # or against-intent, or never
          # muse-api-key: ${{ secrets.MUSE_API_KEY }}  # optional: lets Muse PROPOSE a mapping.
          #   Secrets are not given to pull requests from forks, so commit a mapping.json instead
          #   if outside contributors open PRs.

# Optional: comment the result on the pull request. Off by default. To turn it on, uncomment the
# job below. It alone gets `pull-requests: write`, it runs no code from the pull request (it only
# posts the numbers the check job produced), and no job that runs pull request code ever holds a
# write token. On pull requests from forks GitHub hands out a read-only token, so this job fails
# there; that is GitHub protecting you, not a bug.
